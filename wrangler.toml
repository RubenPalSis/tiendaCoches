# Cloudflare Workers (plan gratuito): sirve la web (/public) y el servidor de la tienda (server/src).
# Publicar: npx wrangler deploy   ·   Desarrollo local: npm run dev (usa [env.dev] con los emuladores)
name = "tienda"
main = "server/src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "auto-trailing-slash" # /catalogo → catalogo.html
not_found_handling = "404-page"
# Solo estas rutas ejecutan el Worker; el resto (HTML, CSS, JS, fuentes) lo sirve Cloudflare sin gastar peticiones.
run_worker_first = ["/api/*", "/fn/*", "/stripe/*", "/producto/*", "/categoria/*", "/sitemap.xml", "/robots.txt", "/__/*", "/dev-media/*"]

# Tarea horaria: reservas caducadas, administradores retirados y reconstrucción del índice del catálogo.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true

# Valores públicos. Los secretos NO van aquí: `npx wrangler secret put NOMBRE`
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, GMAIL_APP_PASSWORD, CLOUDINARY_API_SECRET, FIREBASE_SERVICE_ACCOUNT).
[vars]
SITE_URL = ""                 # p. ej. "https://www.mitienda.es" (vacío = dominio de la petición)
ADMIN_EMAILS = "mivotunning@gmail.com" # emails del panel separados por comas
GMAIL_USER = "mivotunning@gmail.com" # cuenta que envía los emails (su contraseña de aplicación es el secreto GMAIL_APP_PASSWORD)
ORDER_ALERT_EMAILS = "mivotunning@gmail.com" # ÚNICOS destinatarios de los avisos de pedidos, devoluciones y cobros (el panel no los cambia)
FIREBASE_PROJECT_ID = "mivotunning-f973f"
# Configuración web de Firebase (es pública): Configuración del proyecto → Tus apps → Web
FIREBASE_WEB_CONFIG = '{"apiKey":"AIzaSyDBb8lXbRT44PZTtQqa5VWrhyhRHXCuiww","authDomain":"mivotunning-f973f.firebaseapp.com","projectId":"mivotunning-f973f","appId":"1:1021948872243:web:cbe8f8c04ededaf88c0546","messagingSenderId":"1021948872243"}'
CLOUDINARY_CLOUD_NAME = ""
CLOUDINARY_API_KEY = ""
CLOUDINARY_FOLDER = "tienda"

# ---------- Desarrollo local (npm run dev): emuladores de Firebase y fotos simuladas ----------
[env.dev]
name = "tienda-dev"
workers_dev = false
triggers = { crons = [] }

[env.dev.vars]
SITE_URL = ""
ADMIN_EMAILS = "admin@demo.test,otro-admin@demo.test,sin-verificar@demo.test"
ORDER_ALERT_EMAILS = "" # vacío = email de avisos del panel
GMAIL_USER = "" # en local no se envían emails salvo que lo pongas en .dev.vars
FIREBASE_PROJECT_ID = "demo-tienda"
FIREBASE_WEB_CONFIG = ""
FIRESTORE_EMULATOR_HOST = "127.0.0.1:8080"
FIREBASE_AUTH_EMULATOR_HOST = "127.0.0.1:9099"
CLOUDINARY_CLOUD_NAME = ""
CLOUDINARY_API_KEY = ""
CLOUDINARY_FOLDER = "tienda"

# Almacén de fotos simulado: solo existe en local (wrangler dev lo guarda en .wrangler/state).
[[env.dev.kv_namespaces]]
binding = "DEV_MEDIA"
id = "dev-media-local"
